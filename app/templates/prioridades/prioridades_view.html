<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>GestiÃ³n de Prioridades | Violeta Workspace</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/corporate.css') }}" rel="stylesheet">
    <style>
    body {
      background: #f7f7fb;
      font-family: 'Inter', 'Segoe UI', Arial, sans-serif;
      color: #23243a;
      min-height: 100vh;
    }
    .container-main {
      max-width: 560px;
      margin: 2.7rem auto 0 auto;
      background: #fff;
      border-radius: 13px;
      box-shadow: 0 4px 32px #a593f746;
      padding: 2.3rem 2.1rem 2rem 2.1rem;
      position: relative;
    }
    .titulo {
      font-size: 1.35rem;
      font-weight: 700;
      color: #7C3AED;
      letter-spacing: .01em;
      margin-bottom: 1.1em;
      display: flex;
      align-items: center;
      gap: .55em;
    }
    .volver-btn {
      background: #ece9fc;
      color: #6B21A8;
      font-weight: 500;
      border: none;
      border-radius: 8px;
      padding: .43em 1.4em;
      font-size: 1.04em;
      box-shadow: 0 1px 6px #cec0f64a;
      margin-bottom: 1.1em;
      transition: background .13s;
      display: inline-flex;
      align-items: center;
      gap: .5em;
      text-decoration: none;
    }
    .volver-btn:hover {
      background: #e0d1ff;
      color: #512da8;
    }
    .table-prioridad th, .table-prioridad td {
      vertical-align: middle;
      text-align: left;
    }
    .table-prioridad th {
      background: #f5f2fc;
      color: #6B21A8;
      font-weight: 700;
      font-size: 1.04em;
    }
    .table-prioridad tr:last-child td { border-bottom: none; }
    .badge-color {
      display:inline-block;
      width:18px;
      height:18px;
      border-radius:4px;
      margin-right:6px;
      border:1.5px solid #ececec;
      vertical-align: middle;
    }
    .btn-sm {
      font-size: .96em;
      padding: .32em .62em;
    }
    .modal-header {
      background: #f7f2fd;
    }
    .modal-title {
      color: #7C3AED;
      font-weight: 700;
    }
    .label-icon {
      margin-right: 0.35rem;
      color: #6B21A8;
    }
    @media (max-width: 600px) {
      .container-main {padding: 1rem;}
      .titulo {font-size: 1.07rem;}
    }
  </style>
</head>
<body class="violeta-corp">
<div class="container-main shadow-sm">
  <!-- BotÃ³n volver al dashboard -->
  <a href="{{ url_for('usuario.dashboard') }}" class="volver-btn mb-2">
    <i class="bi bi-arrow-left-circle"></i>
    MenÃº principal
  </a>

  <div class="titulo">
    <i class="bi bi-flag"></i> GestiÃ³n de Prioridades
  </div>

  <!-- BotÃ³n para abrir modal nuevo -->
  <button class="btn btn-success mb-3" onclick="abrirModalNuevo()">
    <i class="bi bi-plus-circle"></i> Nueva Prioridad
  </button>

  <div class="table-responsive">
    <table class="table table-hover align-middle table-prioridad">
      <thead>
        <tr>
          <th>ID</th>
          <th>Nombre</th>
          <th>Color</th>
          <th style="text-align:center;">Acciones</th>
        </tr>
      </thead>
      <tbody>
        {% for prioridad in prioridades %}
        <tr>
          <td>{{ prioridad.idprioridad }}</td>
          <td>{{ prioridad.nombre_prioridad }}</td>
          <td>
            <span class="badge-color" style="background:{{ prioridad.color or '#ececec' }}"></span>
            <span>{{ prioridad.color or 'â€”' }}</span>
          </td>
          <td style="text-align:center;">
            <!-- BotÃ³n editar -->
            <button class="btn btn-sm btn-outline-primary"
              onclick="abrirModalEditar({{ prioridad.idprioridad }}, '{{ prioridad.nombre_prioridad|e }}', '{{ prioridad.color|e }}')">
              <i class="bi bi-pencil"></i>
            </button>
            <!-- BotÃ³n eliminar -->
            <form method="POST" action="{{ url_for('prioridad.eliminar_prioridad_view', idprioridad=prioridad.idprioridad) }}" style="display:inline;">
              <button type="submit" class="btn btn-sm btn-outline-danger" onclick="return confirm('Â¿Eliminar esta prioridad?');">
                <i class="bi bi-trash"></i>
              </button>
            </form>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<!-- Modal Nueva Prioridad -->
<div class="modal fade" id="modalNueva" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <form method="POST" action="{{ url_for('prioridad.nueva_prioridad') }}" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-flag"></i> Nueva Prioridad</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" ></button>
      </div>
      <div class="modal-body">
        <div class="mb-2">
          <label><i class="bi bi-type label-icon"></i>Nombre:</label>
          <input type="text" class="form-control" name="nombre_prioridad" required>
        </div>
        <div class="mb-2">
          <label><i class="bi bi-palette label-icon"></i>Color:</label>
          <input type="color" class="form-control form-control-color" name="color" value="#ececec">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-success">Guardar</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal Editar Prioridad -->
<div class="modal fade" id="modalEditar" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <form method="POST" id="formEditar" action="" class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title"><i class="bi bi-pencil"></i> Editar Prioridad</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" ></button>
      </div>
      <div class="modal-body">
        <input type="hidden" name="idprioridad" id="edit_idprioridad">
        <div class="mb-2">
          <label><i class="bi bi-type label-icon"></i>Nombre:</label>
          <input type="text" class="form-control" name="nombre_prioridad" id="edit_nombre" required>
        </div>
        <div class="mb-2">
          <label><i class="bi bi-palette label-icon"></i>Color:</label>
          <input type="color" class="form-control form-control-color" name="color" id="edit_color">
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
      </div>
    </form>
  </div>
</div>

<!-- Bootstrap JS & Modal scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  // Modal Nuevo
  function abrirModalNuevo() {
    var modal = new bootstrap.Modal(document.getElementById('modalNueva'));
    modal.show();
  }
  // Modal Editar con datos
  function abrirModalEditar(id, nombre, color) {
    document.getElementById('edit_idprioridad').value = id;
    document.getElementById('edit_nombre').value = nombre;
    document.getElementById('edit_color').value = color || "#ececec";
    document.getElementById('formEditar').action = '/prioridades/editar/' + id;
    var modal = new bootstrap.Modal(document.getElementById('modalEditar'));
    modal.show();
  }
</script>
</body>
</html>
